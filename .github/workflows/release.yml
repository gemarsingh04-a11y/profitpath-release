name: Build Signed Release APK & AAB

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip Project Files
        run: |
          mkdir -p /tmp/extracted
          unzip -q -o *.zip -d /tmp/extracted
          cp -r /tmp/extracted/* .
          cp -r /tmp/extracted/.[!.]* . 2>/dev/null || true

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Generate Release Keystore
        run: |
          keytool -genkey -v -keystore release.jks -alias profitpath_key -keyalg RSA -keysize 2048 -validity 10000 -storepass profitpath123 -keypass profitpath123 -dname "CN=ProfitPath, OU=Dev, O=ProfitPath, L=Jodhpur, S=Rajasthan, C=IN"

      - name: Build Unsigned Release APK & AAB
        run: |
          gradle assembleRelease
          gradle bundleRelease

      - name: Sign Release APK
        run: |
          BUILD_TOOLS=$(find $ANDROID_HOME/build-tools -maxdepth 1 -type d | sort -V | tail -n 1)
          $BUILD_TOOLS/zipalign -v -p 4 app/build/outputs/apk/release/app-release-unsigned.apk app-release-aligned.apk
          $BUILD_TOOLS/apksigner sign --ks release.jks --ks-pass pass:profitpath123 --key-pass pass:profitpath123 --out ProfitPath-Signed-Release.apk app-release-aligned.apk

      - name: Sign Release AAB
        run: |
          jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 -keystore release.jks -storepass profitpath123 -keypass profitpath123 app/build/outputs/bundle/release/app-release.aab profitpath_key
          cp app/build/outputs/bundle/release/app-release.aab ProfitPath-Signed-Release.aab

      - name: Upload Store-Ready Files
        uses: actions/upload-artifact@v4
        with:
          name: Store-Publish-Files
          path: |
            ProfitPath-Signed-Release.apk
            ProfitPath-Signed-Release.aab
            release.jks
            
