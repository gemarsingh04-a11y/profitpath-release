name: Build Signed Release APK & AAB

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip Project Files
        run: |
          mkdir -p /tmp/extracted
          unzip -q -o *.zip -d /tmp/extracted
          cp -r /tmp/extracted/* .
          cp -r /tmp/extracted/.[!.]* . 2>/dev/null || true

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Generate Exact Project Keystore
        run: |
          STORE_PASS=$(grep -oP 'storePassword\s*=\s*"\K[^"]+' app/build.gradle.kts | head -n 1)
          KEY_ALIAS=$(grep -oP 'keyAlias\s*=\s*"\K[^"]+' app/build.gradle.kts | head -n 1)
          KEY_PASS=$(grep -oP 'keyPassword\s*=\s*"\K[^"]+' app/build.gradle.kts | head -n 1)
          STORE_PASS=${STORE_PASS:-profitpath123}
          KEY_ALIAS=${KEY_ALIAS:-key0}
          KEY_PASS=${KEY_PASS:-$STORE_PASS}
          echo "PASS=$STORE_PASS | ALIAS=$KEY_ALIAS"
          keytool -genkey -v -keystore my-upload-key.jks -alias "$KEY_ALIAS" -keyalg RSA -keysize 2048 -validity 10000 -storepass "$STORE_PASS" -keypass "$KEY_PASS" -dname "CN=ProfitPath, OU=Dev, O=ProfitPath, L=Jodhpur, S=Rajasthan, C=IN"
          cp my-upload-key.jks app/my-upload-key.jks

      - name: Build Signed Release APK & AAB
        run: |
          gradle assembleRelease
          gradle bundleRelease
          cp app/build/outputs/apk/release/*.apk ProfitPath-Signed-Release.apk
          cp app/build/outputs/bundle/release/*.aab ProfitPath-Signed-Release.aab

      - name: Upload Store-Ready Files
        uses: actions/upload-artifact@v4
        with:
          name: Store-Publish-Files
          path: |
            ProfitPath-Signed-Release.apk
            ProfitPath-Signed-Release.aab
            my-upload-key.jks
            
