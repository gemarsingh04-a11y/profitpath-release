name: Build Signed Release APK & AAB

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip Project Files
        run: |
          mkdir -p /tmp/extracted
          unzip -q -o *.zip -d /tmp/extracted
          cp -r /tmp/extracted/* .
          cp -r /tmp/extracted/.[!.]* . 2>/dev/null || true

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Generate Keystore & Configure Signing
        run: |
          keytool -genkey -v -keystore app/my-upload-key.jks -alias profitpath_key -keyalg RSA -keysize 2048 -validity 10000 -storepass profitpath123 -keypass profitpath123 -dname "CN=ProfitPath, OU=Dev, O=ProfitPath, L=Jodhpur, S=Rajasthan, C=IN"
          cp app/my-upload-key.jks my-upload-key.jks
          cat << 'EOF' >> app/build.gradle.kts

          android {
              signingConfigs {
                  getByName("release") {
                      storeFile = file("my-upload-key.jks")
                      storePassword = "profitpath123"
                      keyAlias = "profitpath_key"
                      keyPassword = "profitpath123"
                  }
              }
          }
          EOF

      - name: Build Signed Release APK & AAB
        run: |
          gradle assembleRelease
          gradle bundleRelease
          cp app/build/outputs/apk/release/*.apk ProfitPath-Signed-Release.apk
          cp app/build/outputs/bundle/release/*.aab ProfitPath-Signed-Release.aab

      - name: Upload Store-Ready Files
        uses: actions/upload-artifact@v4
        with:
          name: Store-Publish-Files
          path: |
            ProfitPath-Signed-Release.apk
            ProfitPath-Signed-Release.aab
            my-upload-key.jks
            
