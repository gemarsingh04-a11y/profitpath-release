name: Build Signed Release APK & AAB

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip and Inspect Files
        run: |
          mkdir -p /tmp/extracted
          unzip -q -o *.zip -d /tmp/extracted
          ls -la /tmp/extracted
          find /tmp/extracted -maxdepth 3
          
